services:

  # ==================================================
  # MySQL
  # ==================================================

  mysql:

    image: mysql:8.0

    container_name: autosearch-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

      MYSQL_DATABASE: ${DB_NAME}

    ports:

      - "3307:3306"

    volumes:

      - mysql_data:/var/lib/mysql

    healthcheck:

      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]

      interval: 10s

      timeout: 5s

      retries: 10


  # ==================================================
  # MongoDB
  #
  # Raw HTML Archive Storage
  # ==================================================

  mongo:

    image: mongo:7

    container_name: autosearch-mongo

    restart: unless-stopped

    ports:

      - "27017:27017"

    volumes:

      - mongo_data:/data/db


  # ==================================================
  # AutoSearch V4 / V5
  #
  # FastAPI / Web UI / API
  # ==================================================

  autosearch:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: autosearch-v4

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DB_HOST: mysql

      DB_PORT: 3306

      MONGO_URI: mongodb://host.docker.internal:27017

      MONGO_DATABASE: autosearch

      MONGO_RAW_HTML_COLLECTION: raw_html

    ports:

      - "8000:8000"

    volumes:

      # ----------------------------------------------
      # ChromaDB Persistent Storage
      #
      # Host:
      #   ./chroma_db
      #
      # Container:
      #   /app/chroma_db
      # ----------------------------------------------

      - ./chroma_db:/app/chroma_db

      # ----------------------------------------------
      # Hugging Face Model Cache
      #
      # Host:
      #   %USERPROFILE%\.cache\huggingface
      #
      # Container:
      #   /root/.cache/huggingface
      # ----------------------------------------------
      
      - ${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface

    depends_on:

      mysql:

        condition: service_healthy

      mongo:

        condition: service_started

    command:
      [
        "python",
        "-m",
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  # ==================================================
  # AI Scheduler
  #
  # P3.11.3
  #
  # 負責：
  #
  # - AI Scheduler
  # - AI Worker Pool
  # - Background AI Processing
  # - Worker Monitoring
  #
  # Entry Point:
  #
  # python -m services.ai_scheduler
  #
  # ==================================================

  ai-scheduler:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: autosearch-scheduler

    restart: unless-stopped

    env_file:

      - .env

    environment:

      DB_HOST: mysql

      DB_PORT: 3306

      MONGO_URI: mongodb://host.docker.internal:27017

      MONGO_DATABASE: autosearch

      MONGO_RAW_HTML_COLLECTION: raw_html

    volumes:

      # ----------------------------------------------
      # ChromaDB Persistent Storage
      # ----------------------------------------------

      - ./chroma_db:/app/chroma_db
      

    depends_on:

      mysql:

        condition: service_healthy

      mongo:

        condition: service_started

    command:
      [
        "python",
        "-m",
        "services.ai_scheduler"
      ]


  # ==================================================
  # AutoSearch MCP
  #
  # MCP-1 ~ MCP-4
  #
  # Entry Point:
  #
  # python autosearch_mcp/server.py
  #
  # Transport:
  #
  # STDIO
  #
  # ==================================================

  mcp:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: autosearch-mcp

    restart: unless-stopped

    stdin_open: true

    tty: false

    env_file:

      - .env

    environment:

      DB_HOST: mysql

      DB_PORT: 3306

    depends_on:

      mysql:

        condition: service_healthy

    command:
      [
        "python",
        "autosearch_mcp/server.py"
      ]



# ==================================================
# Persistent Volumes
# ==================================================

volumes:

  mysql_data:

  mongo_data: